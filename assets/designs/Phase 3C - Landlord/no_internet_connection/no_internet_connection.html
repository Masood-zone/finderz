<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        @keyframes signal-pulse {
            0% { transform: scale(1); opacity: 0.1; }
            50% { transform: scale(1.5); opacity: 0.05; }
            100% { transform: scale(2); opacity: 0; }
        }
        .animate-signal {
            animation: signal-pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-lg text-body-lg min-h-screen flex items-center justify-center p-gutter">
<!-- Offline State Container -->
<main class="relative w-full max-w-lg flex flex-col items-center text-center">
<!-- Animated Visual Background Element -->
<div class="absolute -z-10 flex items-center justify-center">
<div class="w-64 h-64 rounded-full bg-primary animate-signal"></div>
<div class="w-64 h-64 rounded-full bg-primary animate-signal delay-700"></div>
</div>
<!-- Premium Connectivity Icon -->
<div class="mb-xl relative">
<div class="w-24 h-24 bg-surface-container-high rounded-full flex items-center justify-center shadow-[0px_4px_12px_rgba(30,58,138,0.08)]">
<span class="material-symbols-outlined text-[48px] text-primary" data-icon="cloud_off">cloud_off</span>
</div>
<!-- Smaller floating badge -->
<div class="absolute -bottom-1 -right-1 w-8 h-8 bg-error rounded-full border-4 border-surface flex items-center justify-center">
<span class="material-symbols-outlined text-[16px] text-on-error" data-icon="wifi_off">wifi_off</span>
</div>
</div>
<!-- Typography Content -->
<h1 class="font-display-lg text-display-lg text-on-background mb-base tracking-tight">
            You're Offline
        </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-xs mb-xl leading-relaxed">
            It seems you've lost your internet connection. Please check your network settings and try again.
        </p>
<!-- Interaction Area -->
<div class="flex flex-col w-full gap-md sm:w-auto">
<button class="bg-secondary-container hover:bg-secondary text-on-secondary-container hover:text-on-secondary font-bold h-[48px] px-xl rounded-xl transition-all duration-300 active:scale-95 flex items-center justify-center gap-base" id="retry-button">
<span class="material-symbols-outlined" data-icon="refresh">refresh</span>
                Retry Connection
            </button>
<button class="bg-transparent border-[1.5px] border-outline-variant hover:bg-surface-container text-on-surface-variant h-[48px] px-xl rounded-xl transition-all duration-300 active:scale-95">
                Check Settings
            </button>
</div>
<!-- Local Ghanaian Contextual Footer -->
<footer class="mt-xl opacity-60">
<p class="font-label-md text-label-md uppercase tracking-widest text-outline">FinderZ Ghana</p>
</footer>
</main>
<!-- Illustrative Background Image (Blurry Architecture) -->
<div class="fixed inset-0 -z-20 pointer-events-none overflow-hidden">
<img class="w-full h-full object-cover opacity-5 grayscale blur-xl" data-alt="A cinematic, softly blurred wide-angle shot of Accra's modern architectural landscape at twilight. The scene is dominated by professional corporate buildings and smooth city surfaces, reflecting a serene and premium aesthetic. The color palette is composed of cool blues and soft grays, mirroring the FinderZ brand identity and creating a high-end, reliable atmosphere for a modern real estate platform." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDMeLHiKkX5J24_-Hg0fgkYxxMnigAWd_EW1Q_IeTIkKyq-HuVlqywdh5TKN5HHKMJIKjFKWO8cbnRd--YFC3Smx3xsCbrCCO4QBKFXn_rKJrqS3QKI7OHS2rQaiWFwPi9vDmQEZvss6U7ivO3_WA7j2fKVmzaL06xvhvTpbrIl7g1ahprsISOcQsQJxOU2SkmtQWmkkkVRRgHzLdjOJmNelk4pddvKPNNPM9RpU2JWnAYpBbaD211o-ONalLd144uTE78zhJ5Hzm0"/>
</div>
<script>
        // Micro-interaction for retry button
        const retryBtn = document.getElementById('retry-button');
        retryBtn.addEventListener('click', () => {
            const icon = retryBtn.querySelector('.material-symbols-outlined');
            icon.classList.add('animate-spin');
            
            // Simulate a reconnection check
            setTimeout(() => {
                icon.classList.remove('animate-spin');
                // Potential logic for checking navigator.onLine could go here
                if (navigator.onLine) {
                    window.location.reload();
                } else {
                    // Small visual feedback if still offline
                    retryBtn.classList.add('shake-horizontal');
                    setTimeout(() => retryBtn.classList.remove('shake-horizontal'), 500);
                }
            }, 1200);
        });

        // Add shake animation styles dynamically
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-5px); }
                75% { transform: translateX(5px); }
            }
            .shake-horizontal {
                animation: shake 0.2s ease-in-out 0s 2;
                background-color: #ffdad6 !important;
                color: #ba1a1a !important;
            }
        `;
        document.head.appendChild(style);
    </script>
