<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- Header Navigation -->
<header class="fixed top-0 w-full z-50 bg-surface h-14 flex items-center px-4 shadow-[0px_4px_12px_rgba(30,58,138,0.08)]">
<button aria-label="Go back" class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container-low transition-colors active:scale-95" onclick="history.back()">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<span class="ml-2 font-headline-lg-mobile text-headline-lg-mobile text-primary font-bold">FinderZ</span>
</header>
<main class="flex-1 flex flex-col pt-20 pb-10 px-container-margin max-w-lg mx-auto w-full">
<!-- Illustration / Visual Anchor -->
<div class="mb-8 w-full aspect-video rounded-xl overflow-hidden shadow-sm">
<img alt="Secure Real Estate" class="w-full h-full object-cover" data-alt="A clean, professional photograph of a modern residential building in Accra, Ghana, bathed in warm golden hour sunlight. The architecture features crisp lines and large windows, reflecting a sense of security and premium living. The overall mood is calm and trustworthy, utilizing a bright color palette with soft shadows to emphasize reliability and high-end real estate service." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCKWI17vViBvahozcc4ttHj_Yt2d9uum_umzKiDY69lty1jiph_tVc244wuVFPx35kVR-x7NAlaEPEnwBUFCbHm108tNwTWcUNGpCd4EZnCgBRCx4yq5h_n9rOq5sZ7nX0bDNf8VLl7MuhisPAAWH5oxBiyV3cdSweUJDtKZv_LY7qPWKnAJAw5-oe5pdb9O_7EuSD0g2Rm_cPmwi5jozFncSLEgFjbsi78_aS5qdNmkw_quKEw0squV6rkcRD7AxwTT0UZYjDwkXI"/>
</div>
<!-- Content Section -->
<div class="space-y-2 mb-8">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background">Forgot Password?</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                Enter your registered email address below to receive a password reset link.
            </p>
</div>
<!-- Form Section -->
<form class="flex flex-col flex-1" id="resetForm" onsubmit="event.preventDefault(); handleResetSubmit();">
<div class="space-y-6">
<!-- Email Field -->
<div class="flex flex-col space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="email">Email Address</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors">mail</span>
</div>
<input class="w-full h-12 pl-12 pr-4 bg-surface-container-lowest border-2 border-outline-variant rounded-lg font-body-lg text-body-lg focus:outline-none focus:border-primary transition-all placeholder:text-outline/50" id="email" name="email" placeholder="e.g. kofi.mensah@email.com" required="" type="email"/>
</div>
</div>
<!-- Action Button -->
<button class="w-full h-12 bg-secondary-container text-on-secondary-container font-bold rounded-lg shadow-sm hover:brightness-95 active:scale-[0.98] transition-all flex items-center justify-center space-x-2" type="submit">
<span class="font-headline-md text-headline-md">Send Reset Link</span>
</button>
</div>
<!-- Additional Help -->
<div class="mt-auto pt-12 flex flex-col items-center space-y-4">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Remember your password? 
                    <a class="text-primary font-bold hover:underline" href="#">Sign In</a>
</p>
<div class="w-16 h-1 bg-surface-container-high rounded-full"></div>
<div class="flex items-center space-x-2 text-on-surface-variant opacity-60">
<span class="material-symbols-outlined text-[18px]">security</span>
<span class="font-label-md text-label-md">Secure verification process</span>
</div>
</div>
</form>
</main>
<!-- Feedback Toast (Hidden by default) -->
<div class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-inverse-surface text-inverse-on-surface px-6 py-3 rounded-full shadow-lg transform translate-y-32 opacity-0 transition-all duration-300 z-[100] flex items-center space-x-2" id="toast">
<span class="material-symbols-outlined text-secondary-fixed">check_circle</span>
<span class="font-body-md text-body-md">Reset link sent successfully!</span>
</div>
<script>
        function handleResetSubmit() {
            const btn = document.querySelector('button[type="submit"]');
            const toast = document.getElementById('toast');
            const email = document.getElementById('email').value;

            if(!email) return;

            // Loading state
            btn.disabled = true;
            btn.innerHTML = '<span class="animate-spin material-symbols-outlined">progress_activity</span>';

            // Simulate API Call
            setTimeout(() => {
                btn.disabled = false;
                btn.innerHTML = '<span class="font-headline-md text-headline-md">Send Reset Link</span>';
                
                // Show Toast
                toast.classList.remove('translate-y-32', 'opacity-0');
                toast.classList.add('translate-y-0', 'opacity-100');

                // Clear input
                document.getElementById('email').value = '';

                setTimeout(() => {
                    toast.classList.add('translate-y-32', 'opacity-0');
                    toast.classList.remove('translate-y-0', 'opacity-100');
                }, 3000);
            }, 1500);
        }

        // Active state feedback for inputs
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.parentElement.classList.remove('scale-[1.01]');
            });
        });
    </script>
